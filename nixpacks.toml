# Nixpacks (Railway / Coolify / raw nixpacks builds)
#
# The bot and the dashboard are one long-lived Node process, so we do a
# plain install + start. No build step, no separate worker.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci --omit=dev || npm install --omit=dev"]

[phases.build]
cmds = ["node --check index.js"]

[start]
cmd = "node index.js"

[variables]
NODE_ENV = "production"
NPM_CONFIG_UPDATE_NOTIFIER = "false"
